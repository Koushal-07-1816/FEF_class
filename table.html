<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h2>HTML TABLE TAG EXAMPLE</h2>
    <table border="12">
        <caption> Student Marks </caption>



        <colgroup>
        <col style="background-color: lightyellow;">
        <col style="background-color: lightblue;">
        <col style="background-color: lightblue;">
        </colgroup>
        
        
        <thead>
        <tr>
            <th>Student name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td rowspan="2" style="padding: 20px;">Ravi</td>
            <td>HTML</td>
            <td>0660</td>
        </tr>
        <tr>
           
            <td>CSS</td>
            <td>0660</td>
        </tr>
        <tr>
            <td rowspan="2" style="padding: 20px;">priya</td>
            <td>HTML</td>
            <td>0660</td>
        </tr>
         <tr>
            
            <td>CSS</td>
            <td>0660</td>
        </tr>
        </tbody>
        <tfoot>
         <tr>
            <td colspan="2" style="padding: 10px;" >Total Students</td>
            
            <td>2</td>
        </tr>
        </tfoot>

    </table>
</body>
</html>
